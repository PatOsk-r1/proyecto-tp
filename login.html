<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Entrar · Proyecto TP</title>
    <meta name="theme-color" content="#1b1440">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Proyecto TP">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-login">
    <main class="caja-login">
        <img class="logo-login" src="icons/icon-192.png" alt="" width="72" height="72">
        <h1 id="titulo">Entrar</h1>

        <button id="con-google" class="boton-google" type="button">
            <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
            </svg>
            Entrar con Google
        </button>

        <p class="separador">o con tu email</p>

        <form id="formulario" class="formulario" novalidate>
            <label id="campo-nombre" class="campo" hidden>
                <span>Nombre</span>
                <input id="nombre" type="text" autocomplete="nickname" maxlength="30">
            </label>
            <label class="campo">
                <span>Email</span>
                <input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" required>
            </label>
            <label class="campo">
                <span>Contraseña</span>
                <input id="clave" type="password" autocomplete="current-password" minlength="6" required>
            </label>
            <label id="campo-repetir" class="campo" hidden>
                <span>Repetir contraseña</span>
                <input id="repetir" type="password" autocomplete="new-password" minlength="6">
            </label>

            <p id="aviso" class="aviso" role="alert" hidden></p>

            <button id="boton" class="boton-principal" type="submit">Entrar</button>
        </form>

        <button id="cambiar-modo" class="boton-texto" type="button">¿No tenés cuenta? Creá una</button>
        <button id="olvide" class="boton-texto" type="button">Olvidé mi contraseña</button>
    </main>

    <script type="module" src="js/login.js"></script>
</body>
</html>
