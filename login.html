<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Entrar · Proyecto TP</title>
    <meta name="theme-color" content="#140f33">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Proyecto TP">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="pagina-login">
    <!-- Fondo: luces de colores y fichas de juegos flotando -->
    <div class="fondo-login" aria-hidden="true">
        <i class="luz l1"></i><i class="luz l2"></i><i class="luz l3"></i>
        <span class="ficha f1">🎲</span><span class="ficha f2">🃏</span><span class="ficha f3">🐠</span>
        <span class="ficha f4">🌾</span><span class="ficha f5">⚔️</span><span class="ficha f6">🏝️</span>
        <span class="ficha f7">🚀</span><span class="ficha f8">🎯</span><span class="ficha f9">🪙</span>
    </div>

    <main class="caja-login">
        <div class="marca">
            <div class="logo-aro"><img class="logo-login" src="icons/icon-192.png" alt="" width="76" height="76"></div>
            <h1>Proyecto TP</h1>
            <p class="lema">Granja, casino, aventuras y duelos con amigos</p>
        </div>

        <div class="tarjeta-login">
            <div class="selector-modo" role="tablist">
                <button id="modo-entrar" class="activo" type="button" role="tab" aria-selected="true">Entrar</button>
                <button id="modo-crear" type="button" role="tab" aria-selected="false">Crear cuenta</button>
                <i class="marcador"></i>
            </div>
            <h2 id="titulo" class="solo-lector">Entrar</h2>
            <p id="banner-invitado" class="banner-invitado" hidden>🎮 Estás jugando como invitado. Creá tu cuenta y se guarda todo tu progreso.</p>

            <button id="con-google" class="boton-google" type="button">
                <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
                </svg>
                Seguir con Google
            </button>

            <button id="invitado" class="boton-invitado" type="button">🎮 Jugar como invitado</button>
            <p id="nota-invitado" class="nota-invitado">Sin registrarte. Cuando quieras creás la cuenta y se guarda todo.</p>

            <p class="separador">o con tu email</p>

            <form id="formulario" class="formulario" novalidate>
                <label id="campo-nombre" class="campo" hidden>
                    <span>Nombre</span>
                    <div class="entrada">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
                        <input id="nombre" type="text" autocomplete="nickname" maxlength="30" placeholder="Cómo te ven tus amigos">
                    </div>
                </label>
                <label class="campo">
                    <span>Email</span>
                    <div class="entrada">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>
                        <input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" required placeholder="tu@email.com">
                    </div>
                </label>
                <label class="campo">
                    <span>Contraseña</span>
                    <div class="entrada">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        <input id="clave" type="password" autocomplete="current-password" minlength="6" required placeholder="Mínimo 6 caracteres">
                        <button id="ver-clave" class="ver-clave" type="button" aria-label="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </label>
                <label id="campo-repetir" class="campo" hidden>
                    <span>Repetir contraseña</span>
                    <div class="entrada">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        <input id="repetir" type="password" autocomplete="new-password" minlength="6" placeholder="Otra vez la misma">
                    </div>
                </label>

                <p id="aviso" class="aviso" role="alert" hidden></p>

                <button id="boton" class="boton-principal" type="submit">Entrar</button>
            </form>

            <button id="olvide" class="boton-texto" type="button">Olvidé mi contraseña</button>
            <button id="cambiar-modo" class="boton-texto" type="button" hidden>¿No tenés cuenta? Creá una</button>
        </div>
    </main>

    <script type="module" src="js/login.js"></script>
</body>
</html>
