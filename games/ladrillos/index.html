<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Rompeladrillos · Proyecto TP</title>
    <meta name="theme-color" content="#10002b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/solitario.css">
    <style>
        .tema-ladrillos {
            --fondo: #0a0118;
            --fondo-2: #240046;
            --texto-suave: #e0c3fc;
            --acento: #4cc9f0;
            --acento-2: #4361ee;
            --panel: #06000fcc;
        }
        .tema-ladrillos .boton-grande { color: #06000f; }
        .zona-juego { padding: 6px; }
        .boton-taller {
            pointer-events: auto;
            font: inherit;
            font-weight: 900;
            font-size: 1rem;
            color: #fff;
            background: linear-gradient(180deg, #f72585, #7209b7);
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            box-shadow: 0 4px 0 #0008;
        }
        .taller {
            justify-content: flex-start;
            padding-top: 18px;
            overflow-y: auto;
            pointer-events: auto;
        }
        .lista-taller {
            width: min(100%, 420px);
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .item-taller {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            font: inherit;
            text-align: left;
            color: #fff;
            background: linear-gradient(160deg, #ffffff1c, #ffffff08);
            border: 1px solid #ffffff2a;
            border-radius: 14px;
        }
        .item-taller .ico { font-size: 1.4rem; }
        .item-taller .txt { flex: 1; font-size: 0.85rem; font-weight: 800; }
        .item-taller .txt small { display: block; color: var(--texto-suave); font-weight: 600; }
        .item-taller .precio { font-weight: 900; color: #ffd166; white-space: nowrap; }
        .item-taller.puesto { border-color: var(--acento); box-shadow: 0 0 12px #4cc9f066; }
        .item-taller:disabled { opacity: 0.45; }
        .subtitulo-taller { font-size: 0.9rem; color: var(--texto-suave); margin-top: 6px; }
        .monedas-taller { font-size: 1rem; color: #ffd166; }
    </style>
</head>
<body class="pantalla-3d tema-ladrillos">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Rompeladrillos</h1>
    </header>

    <div class="info-juego">
        <div class="dato"><span>Puntos</span><strong id="puntos">0</strong></div>
        <div class="dato"><span>Nivel</span><strong id="nivel">1</strong></div>
        <div class="dato"><span>Vidas</span><strong id="vidas">3</strong></div>
        <div class="dato"><span>Monedas</span><strong id="monedas">0</strong></div>
    </div>

    <main class="zona-juego">
        <canvas id="lienzo" class="lienzo-juego"></canvas>
        <div id="centro" class="mensaje-centro">
            <div id="titulo-centro">Rompeladrillos<div class="chico">Mové la paleta con el dedo. Juntá monedas y poderes. Récord: <span id="record">0</span></div></div>
            <button id="jugar" class="boton-grande" type="button">Jugar</button>
            <button id="abrir-taller" class="boton-taller" type="button">🛠️ Taller</button>
        </div>
        <div id="taller" class="mensaje-centro taller" hidden>
            <div>🛠️ Taller <span class="monedas-taller">🪙 <b id="monedas-taller">0</b></span></div>
            <div class="lista-taller" id="mejoras-taller"></div>
            <div class="subtitulo-taller">Estilos de paleta y pelota</div>
            <div class="lista-taller" id="estilos-taller"></div>
            <button id="cerrar-taller" class="boton-grande" type="button">Listo</button>
        </div>
    </main>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
