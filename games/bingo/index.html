<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Bingo · Proyecto TP</title>
    <meta name="theme-color" content="#3a0ca3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <style>
        .tema-bingo {
            --fondo: #10002b;
            --fondo-2: #3a0ca3;
            --texto-suave: #d6ccff;
            --acento: #ffd166;
            --acento-2: #ff7a1a;
            --panel: #08001acc;
        }
        .zona-b { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 10px; overflow-y: auto; }
        .tubo { display: flex; align-items: center; gap: 10px; }
        .bolilla-grande {
            width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
            font-size: 1.6rem; font-weight: 900; color: #10002b;
            background: radial-gradient(circle at 35% 30%, #fff, var(--c, #ffd166) 55%, #0004);
            box-shadow: 0 6px 14px #000a; animation: salir 0.35s cubic-bezier(0.2, 1.6, 0.4, 1);
        }
        .bolilla-grande small { display: block; font-size: 0.6rem; margin-bottom: -6px; }
        @keyframes salir { from { transform: translateY(-40px) scale(0.3); } }
        .contador { font-size: 0.8rem; font-weight: 800; color: var(--texto-suave); text-align: center; }
        .contador b { font-size: 1.2rem; color: var(--acento); display: block; }
        .ultimas { display: flex; gap: 4px; }
        .ultimas span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.7rem; font-weight: 900; color: #10002b; background: var(--c); opacity: 0.8; }
        .cartones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; width: min(100%, 480px); }
        .carton { padding: 6px; border-radius: 14px; background: #fff; box-shadow: 0 6px 14px #0008; }
        .carton.gano { box-shadow: 0 0 0 3px var(--acento), 0 0 22px var(--acento); }
        .cabeza { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-weight: 900; font-size: 0.85rem; margin-bottom: 3px; }
        .cabeza span:nth-child(1) { color: #e63946; } .cabeza span:nth-child(2) { color: #f77f00; } .cabeza span:nth-child(3) { color: #2a9d8f; } .cabeza span:nth-child(4) { color: #4361ee; } .cabeza span:nth-child(5) { color: #7209b7; }
        .numeros { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
        .numeros span {
            position: relative; aspect-ratio: 1; display: grid; place-items: center;
            font-weight: 900; font-size: 0.85rem; color: #10002b; background: #f1f0ff; border-radius: 6px;
        }
        .numeros span.libre { background: #ffd166; font-size: 0.7rem; }
        .numeros span.marcado::after {
            content: ""; position: absolute; inset: 10%; border-radius: 50%;
            background: radial-gradient(circle, #ff006eaa, #ff006e66); animation: sello 0.3s cubic-bezier(0.2, 1.6, 0.4, 1);
        }
        .numeros span.en-linea { background: #ffd166; }
        @keyframes sello { from { transform: scale(2); opacity: 0; } }
        .mensaje-b { min-height: 1.4em; font-size: 1.15rem; font-weight: 900; text-align: center; }
        .mensaje-b.gano { color: var(--acento); animation: aparecer 0.3s ease-out; }
        .pagos-b { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; font-size: 0.72rem; font-weight: 800; }
        .pagos-b span { padding: 3px 8px; border-radius: 999px; background: #0006; }
        .pagos-b b { color: var(--acento); }
        .cuantos { display: flex; gap: 4px; justify-content: center; align-items: center; font-size: 0.8rem; font-weight: 800; color: var(--texto-suave); }
        .cuantos button { font: inherit; font-weight: 900; color: var(--texto); background: #ffffff14; border: 2px solid #ffffff22; border-radius: 999px; padding: 4px 12px; }
        .cuantos button.activo { border-color: var(--acento); color: var(--acento); }
        .cuantos button:disabled:not(.activo) { opacity: 0.4; }
        #jugar { color: #2a1400; }
    </style>
</head>
<body class="pantalla-3d tema-casino tema-bingo">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Bingo</h1>
        <div id="fichas" class="fichas-total"></div>
    </header>

    <main class="zona-b">
        <div class="tubo">
            <div class="contador">Bolillas<b id="contador">0/32</b></div>
            <div id="bolilla" class="bolilla-grande" style="--c:#ffd166">?</div>
            <div id="ultimas" class="ultimas"></div>
        </div>
        <div id="mensaje" class="mensaje-b">Elegí cuántos cartones y jugá</div>
        <div id="cartones" class="cartones"></div>
        <div id="pagos" class="pagos-b"></div>
    </main>

    <div class="controles-casino">
        <div class="cuantos">
            Cartones:
            <button data-cuantos="1" class="activo">1</button>
            <button data-cuantos="2">2</button>
            <button data-cuantos="3">3</button>
            <button data-cuantos="4">4</button>
        </div>
        <div class="apuesta-fila">
            <button id="menos" class="redondo" type="button">−</button>
            <div class="apuesta">Por cartón<strong id="apuesta">10</strong></div>
            <button id="mas" class="redondo" type="button">+</button>
        </div>
        <button id="jugar" class="accion" type="button">🎱 Jugar</button>
        <button id="recargar" class="accion secundaria" type="button" hidden>Recargar fichas</button>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
