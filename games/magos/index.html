<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Fusión mágica · Proyecto TP</title>
    <meta name="theme-color" content="#14092e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/solitario.css">
    <style>
        .tema-magos {
            --fondo: #0b0520;
            --fondo-2: #2a1260;
            --texto-suave: #dccfff;
            --acento: #c77dff;
            --acento-2: #7b2cbf;
            --panel: #07031acc;
        }
        .tema-magos .boton-grande { color: #fff; }
        .zona-juego { padding: 4px; }
        .barra-m {
            display: flex;
            gap: 8px;
            padding: 8px 10px calc(12px + env(safe-area-inset-bottom));
            background: var(--panel);
            border-top: 1px solid var(--borde);
        }
        .barra-m button {
            font: inherit;
            font-weight: 900;
            border: none;
            border-radius: 14px;
            padding: 12px 10px;
            box-shadow: 0 4px 0 #0008;
        }
        #invocar { flex: 2; font-size: 1.05rem; color: #fff; background: linear-gradient(180deg, #c77dff, #5a189a); }
        #invocar small { display: block; font-size: 0.75rem; color: #ffd166; }
        #oleada-btn { flex: 1; color: #1b0b33; background: linear-gradient(180deg, #ffe08a, #ff9f1c); }
        #velocidad { flex: 0.6; color: #fff; background: #ffffff22; }
        .barra-m button:disabled { opacity: 0.45; }
        .barra-m button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0008; }
        .enlace-lab { pointer-events: auto; font: inherit; font-weight: 900; font-size: 1rem; color: #fff; background: #3a0ca3; border: none; border-radius: 999px; padding: 10px 18px; }
        .lab { justify-content: flex-start; padding-top: 20px; overflow-y: auto; pointer-events: auto; }
        .lista-lab { width: min(100%, 420px); display: flex; flex-direction: column; gap: 7px; }
        .mejora-m { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font: inherit; text-align: left; color: #fff; background: #ffffff14; border: 1px solid #ffffff2a; border-radius: 14px; }
        .mejora-m .ico { font-size: 1.4rem; width: 32px; text-align: center; }
        .mejora-m .txt { flex: 1; font-size: 0.85rem; font-weight: 800; }
        .mejora-m .txt small { display: block; color: var(--texto-suave); font-weight: 600; }
        .mejora-m .precio { font-weight: 900; color: #7df9ff; }
        .mejora-m:disabled { opacity: 0.45; }
    </style>
</head>
<body class="pantalla-3d tema-magos">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Fusión mágica</h1>
    </header>

    <div class="info-juego">
        <div class="dato"><span>Oleada</span><strong id="oleada">0</strong></div>
        <div class="dato"><span>Vidas</span><strong id="vidas">10</strong></div>
        <div class="dato"><span>Maná</span><strong id="mana">0</strong></div>
        <div class="dato"><span>Cristales</span><strong id="cristales">0</strong></div>
    </div>

    <main class="zona-juego">
        <canvas id="lienzo" class="lienzo-juego"></canvas>
        <div id="menu" class="mensaje-centro">
            <div id="titulo-menu">Fusión mágica<div class="chico">Invocá magos y arrastrá uno sobre otro igual para fusionarlos. Los monstruos dan la vuelta por el camino: ¡que no lleguen al portal!</div></div>
            <button id="jugar" class="boton-grande" type="button">Jugar</button>
            <button id="abrir-lab" class="enlace-lab" type="button">📚 Biblioteca</button>
        </div>
        <div id="lab" class="mensaje-centro lab" hidden>
            <div>📚 Biblioteca <span style="color:#7df9ff;font-size:1rem">💠 <b id="cristales-lab">0</b></span></div>
            <div id="lista-lab" class="lista-lab"></div>
            <button id="cerrar-lab" class="boton-grande" type="button">Listo</button>
        </div>
    </main>

    <div class="barra-m">
        <button id="invocar" type="button">✨ Invocar<small id="costo">10 maná</small></button>
        <button id="oleada-btn" type="button">▶ Oleada</button>
        <button id="velocidad" type="button">×1</button>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
