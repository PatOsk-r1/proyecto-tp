<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Memotest · Proyecto TP</title>
    <meta name="theme-color" content="#3c096c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/solitario.css">
    <style>
        .tema-memo {
            --fondo: #240046;
            --fondo-2: #5a189a;
            --texto-suave: #e0c3fc;
            --acento: #ffd23f;
            --acento-2: #ff9f1c;
            --panel: #10002bcc;
        }
        .mesa-memo {
            display: grid;
            gap: clamp(6px, 1.6vw, 10px);
            perspective: 900px;
        }
        .carta-m {
            position: relative;
            aspect-ratio: 0.8;
            border: none;
            padding: 0;
            background: none;
            transform-style: preserve-3d;
            transition: transform 0.4s;
        }
        .carta-m.vista, .carta-m.par { transform: rotateY(180deg); }
        .carta-m.par { animation: festejo 0.45s ease-out 0.35s; }
        @keyframes festejo { 50% { transform: rotateY(180deg) scale(1.12); } }
        .carta-m .dorso, .carta-m .frente {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 12px #0008;
        }
        .carta-m .dorso {
            background:
                radial-gradient(circle at 50% 50%, #ffd23f 0 12%, transparent 13%),
                repeating-linear-gradient(45deg, #7b2cbf 0 8px, #9d4edd 8px 16px);
            border: 3px solid #fff;
        }
        .carta-m .frente {
            transform: rotateY(180deg);
            background: linear-gradient(160deg, #ffffff, #efe6ff);
            border: 3px solid #c77dff;
        }
        .carta-m.par .frente { border-color: #7ee08f; box-shadow: 0 0 16px #7ee08f; }
        .carta-m .frente svg { width: 72%; height: 72%; }
    </style>
</head>
<body class="pantalla-3d tema-memo">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Memotest</h1>
    </header>

    <div class="info-juego">
        <div class="dato"><span>Pares</span><strong id="pares">0/8</strong></div>
        <div class="dato"><span>Intentos</span><strong id="intentos">0</strong></div>
        <div class="dato"><span>Récord</span><strong id="record">—</strong></div>
    </div>

    <main class="zona-juego">
        <div id="mesa" class="mesa-memo"></div>
        <div id="centro" class="mensaje-centro">
            <div id="titulo-centro">Memotest<div class="chico">Encontrá todos los pares con la menor cantidad de intentos</div></div>
            <div class="dificultad">
                <button data-nivel="0">8 pares</button>
                <button data-nivel="1">10 pares</button>
                <button data-nivel="2">15 pares</button>
            </div>
            <button id="jugar" class="boton-grande" type="button">Jugar</button>
        </div>
    </main>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
