<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Defensa de torres · Proyecto TP</title>
    <meta name="theme-color" content="#1a2e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/solitario.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="pantalla-3d tema-torres">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Defensa de torres</h1>
        <button id="pausa" class="boton-chico-t" type="button" hidden>⏸</button>
    </header>

    <div class="info-juego">
        <div class="dato"><span>Oleada</span><strong id="oleada">0</strong></div>
        <div class="dato"><span>Castillo</span><strong id="vidas">20</strong></div>
        <div class="dato"><span>Oro</span><strong id="oro">0</strong></div>
        <div class="dato"><span>Estrellas</span><strong id="estrellas">0</strong></div>
    </div>

    <main class="zona-juego">
        <canvas id="lienzo" class="lienzo-juego"></canvas>
        <div id="proxima" class="proxima"></div>

        <div id="panel-torre" class="panel-torre" hidden>
            <div class="cabeza-panel"><strong id="nombre-torre">Cañón</strong><span id="nivel-torre">Nv 1</span><button id="cerrar-panel" type="button">✕</button></div>
            <div id="stats-torre" class="stats-torre"></div>
            <div class="botones-panel">
                <button id="mejorar" type="button">Mejorar</button>
                <button id="objetivo" class="secundario" type="button">Primero</button>
                <button id="vender" class="vender" type="button">Vender</button>
            </div>
        </div>

        <div id="menu" class="mensaje-centro">
            <div id="titulo-menu">Defensa de torres<div class="chico">Construí torres al costado del camino. Cada oleada te da estrellas para el laboratorio.</div></div>
            <div id="mapas" class="mapas"></div>
            <button id="continuar" class="boton-grande" type="button" hidden>Continuar partida</button>
            <button id="jugar" class="boton-grande" type="button">Jugar</button>
            <button id="abrir-lab" class="enlace-lab" type="button">🔬 Laboratorio</button>
        </div>

        <div id="lab" class="mensaje-centro lab" hidden>
            <div class="titulo-lab">🔬 Laboratorio <span>⭐ <b id="estrellas-lab">0</b></span></div>
            <div id="mejoras-lab" class="mejoras-lab"></div>
            <button id="cerrar-lab" class="boton-grande" type="button">Listo</button>
        </div>
    </main>

    <div class="tienda">
        <div id="torres-tienda" class="torres-tienda"></div>
        <div class="acciones-t">
            <button id="oleada-btn" type="button">▶ Oleada</button>
            <div class="fila-acc">
                <button id="velocidad" class="secundario" type="button">×1</button>
                <button id="auto" class="secundario" type="button">Auto</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
