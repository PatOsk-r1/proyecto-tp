<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Limbo · Proyecto TP</title>
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/originales.css">
    <style>
        .tema-limbo { --acento: #8b7bff; --fondo-2: #1a1638; }
        .escenario-limbo {
            position: relative;
            flex: 1;
            min-height: 150px;
            border-radius: 20px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 120%, #8b7bff33, transparent 60%), #0a0d18;
            border: 1px solid var(--borde);
            display: grid;
            place-items: center;
        }
        .escenario-limbo canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        .numero-limbo {
            position: relative;
            font-size: clamp(3.4rem, 18vw, 5.4rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            text-shadow: 0 6px 30px #000c;
        }
        .numero-limbo.salto { animation: salto-limbo 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
        @keyframes salto-limbo { from { transform: scale(0.8); } }
        .leyenda-limbo {
            position: absolute;
            bottom: 14px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--texto-suave);
        }
        .elegir-objetivo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .elegir-objetivo .redondo { flex-shrink: 0; }
        .caja-objetivo {
            flex: 1;
            text-align: center;
            padding: 8px;
            border-radius: 12px;
            background: #ffffff08;
            border: 1px solid var(--borde);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--texto-suave);
        }
        .caja-objetivo strong { display: block; font-size: 1.5rem; color: var(--texto); letter-spacing: 0; }
        .rapidos { display: flex; gap: 6px; }
        .rapidos button {
            flex: 1;
            padding: 7px 0;
            border-radius: 10px;
            border: 1px solid var(--borde);
            font: inherit;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--texto-suave);
            background: #ffffff08;
        }
        .rapidos button.activo { color: #0b0820; background: var(--acento); border-color: transparent; }
    </style>
</head>
<body class="pantalla-3d tema-casino tema-original tema-limbo">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Limbo</h1>
        <div id="fichas" class="fichas-total"></div>
    </header>

    <main class="zona-original">
        <div id="historial" class="historial-o"></div>
        <div class="escenario-limbo">
            <canvas id="lienzo"></canvas>
            <div id="numero" class="numero-limbo">1.00×</div>
            <div id="leyenda" class="leyenda-limbo">Si sale más que tu objetivo, ganás</div>
        </div>
        <div class="elegir-objetivo">
            <button id="bajar" class="redondo" type="button">−</button>
            <div class="caja-objetivo">Objetivo<strong id="objetivo">2.00×</strong></div>
            <button id="subir" class="redondo" type="button">+</button>
        </div>
        <div class="rapidos" id="rapidos">
            <button data-o="1.5" type="button">1.5×</button>
            <button data-o="2" type="button">2×</button>
            <button data-o="5" type="button">5×</button>
            <button data-o="10" type="button">10×</button>
            <button data-o="100" type="button">100×</button>
            <button data-o="1000" type="button">1000×</button>
        </div>
        <div class="datos-o">
            <div>Chance<strong id="chance">49.5%</strong></div>
            <div>Cobrás<strong id="ganancia">20</strong></div>
            <div>Récord<strong id="record">—</strong></div>
        </div>
    </main>

    <div class="controles-casino">
        <div class="apuesta-fila">
            <button id="menos" class="redondo" type="button">−</button>
            <div class="apuesta">Apuesta<strong id="apuesta">10</strong></div>
            <button id="mas" class="redondo" type="button">+</button>
        </div>
        <div class="fila-botones">
            <button id="accion" class="accion" type="button">Jugar</button>
            <div class="auto-o"><button id="auto" type="button">Auto</button></div>
        </div>
        <button id="recargar" class="accion secundaria" type="button" hidden>Recargar fichas</button>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
