<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Buscaminas · Proyecto TP</title>
    <meta name="theme-color" content="#1b2a3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/solitario.css">
    <style>
        .tema-minas {
            --fondo: #101b26;
            --fondo-2: #23394d;
            --texto-suave: #c8dcef;
            --acento: #7ee08f;
            --acento-2: #2fb350;
            --panel: #0a121acc;
        }
        .campo {
            display: grid;
            gap: 2px;
            padding: 6px;
            border-radius: 12px;
            background: #0b1520;
            box-shadow: 0 14px 30px #000a;
            touch-action: manipulation;
        }
        .celda-b {
            position: relative;
            aspect-ratio: 1;
            border: none;
            padding: 0;
            border-radius: 5px;
            font: inherit;
            font-weight: 900;
            background: linear-gradient(150deg, #8ed07a, #4f9a45);
            box-shadow: inset 0 -3px 0 #2f6a2a, inset 0 2px 0 #c7f0b8;
            transition: transform 0.1s;
        }
        .celda-b:active { transform: scale(0.92); }
        .celda-b.abierta {
            background: #e9dcc2;
            box-shadow: inset 0 0 0 1px #cbb894;
            animation: abrir 0.18s ease-out;
        }
        @keyframes abrir { from { transform: scale(0.7); } }
        .celda-b.mina-roja { background: #ff4d4d; }
        .celda-b svg { position: absolute; inset: 12%; width: 76%; height: 76%; }
        .n1 { color: #1e6fd9; } .n2 { color: #2e9a3a; } .n3 { color: #d62828; } .n4 { color: #6a2c91; }
        .n5 { color: #a0522d; } .n6 { color: #0f8b8d; } .n7 { color: #222; } .n8 { color: #777; }
        .celda-b.explota::after {
            content: "";
            position: absolute;
            inset: -80%;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0 10%, #ffd166 25%, #ff6b35 45%, transparent 70%);
            animation: boom 0.6s ease-out forwards;
            z-index: 3;
        }
        @keyframes boom { from { transform: scale(0.2); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
    </style>
</head>
<body class="pantalla-3d tema-minas">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Buscaminas</h1>
    </header>

    <div class="info-juego">
        <div class="dato"><span>Minas</span><strong id="minas">10</strong></div>
        <div class="dato"><span>Tiempo</span><strong id="tiempo">0</strong></div>
        <div class="dato"><span>Récord</span><strong id="record">—</strong></div>
    </div>

    <main class="zona-juego">
        <div id="campo" class="campo"></div>
        <div id="centro" class="mensaje-centro">
            <div id="titulo-centro">Buscaminas<div class="chico">Destapá todo sin pisar una mina. Los números dicen cuántas hay alrededor.</div></div>
            <div class="dificultad">
                <button data-nivel="0">Fácil</button>
                <button data-nivel="1">Medio</button>
                <button data-nivel="2">Difícil</button>
            </div>
            <button id="jugar" class="boton-grande" type="button">Jugar</button>
        </div>
    </main>

    <div class="barra-botones">
        <button id="modo-abrir" class="boton-modo activo" type="button">⛏ Destapar</button>
        <button id="modo-bandera" class="boton-modo" type="button">🚩 Bandera</button>
        <button id="reiniciar" class="boton-modo" type="button">↻ Nueva</button>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
