<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Pool · Proyecto TP</title>
    <meta name="theme-color" content="#1a0f08">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="pantalla-3d tema-pool">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Pool</h1>
    </header>

    <div class="jugadores">
        <div id="j0" class="jugador">
            <div class="nombre">Vos</div>
            <div class="grupo">Mesa abierta</div>
            <div class="bolitas"></div>
        </div>
        <div id="j1" class="jugador">
            <div class="nombre">Compu</div>
            <div class="grupo">Mesa abierta</div>
            <div class="bolitas"></div>
        </div>
    </div>

    <div id="lienzo" class="lienzo-3d">
        <!-- Barra para tirar: se desliza el taco hacia abajo y se suelta -->
        <div id="barra" class="barra-taco" hidden>
            <div class="riel">
                <div id="relleno" class="relleno"></div>
                <div id="taco-barra" class="taco-barra"></div>
            </div>
            <span id="porcentaje">Fuerza</span>
        </div>
        <div id="ajuste" class="ajuste" hidden>
            <button id="girar-izq" type="button" aria-label="Girar a la izquierda">↺</button>
            <button id="girar-der" type="button" aria-label="Girar a la derecha">↻</button>
        </div>
        <div id="ayuda" class="ayuda-tiro" hidden>Tocá la mesa para apuntar · ↺↻ para ajustar · deslizá el taco para tirar</div>
        <div id="esperando" class="ayuda-tiro" hidden></div>
        <div id="aviso" class="mensaje-centro" hidden></div>
        <div id="centro" class="mensaje-centro">
            <div id="titulo-centro">Bola 8<div class="chico">Embocá tu grupo y después la negra</div></div>
            <div id="opciones" class="dificultad">
                <button data-nivel="0">Fácil</button>
                <button data-nivel="1">Normal</button>
                <button data-nivel="2">Difícil</button>
            </div>
            <button id="jugar" class="boton-grande" type="button">Jugar contra la compu</button>
            <a id="ir-amigos" class="enlace-amigos" href="../../amigos.html">👥 Jugar con un amigo</a>
            <div id="record" class="chico"></div>
        </div>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
