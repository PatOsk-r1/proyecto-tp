<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Marea · Proyecto TP</title>
    <meta name="theme-color" content="#0f4c81">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <style>
        .cartel-grupo {
            font-size: 1rem;
            background: #1f6fe0;
            border: 2px solid #fff;
            box-shadow: 0 3px 8px #0006;
        }
        .cartel-grupo.rival {
            background: #e0392b;
        }
    </style>
</head>
<body class="pantalla-3d tema-marea">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Marea</h1>
    </header>

    <div id="lienzo" class="lienzo-3d">
        <div class="marcador">
            <div id="monedas" class="grande">0</div>
            <div id="nivel" class="chico">Nivel 1</div>
        </div>
        <div id="cartel" class="etiqueta-3d cartel-grupo" hidden></div>
        <div id="cartel-rival" class="etiqueta-3d cartel-grupo rival" hidden></div>
        <div id="centro" class="mensaje-centro">
            <div id="titulo-centro">Deslizá para elegir las puertas</div>
            <button id="jugar" class="boton-grande" type="button">Jugar</button>
        </div>
    </div>

    <div id="mejoras" class="panel-mejoras"></div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
