<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Panadería · Proyecto TP</title>
    <meta name="theme-color" content="#6f4518">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="pantalla-3d tema-panaderia">
    <header class="barra-juego barra-pan">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Panadería</h1>
        <div class="hud-pan">
            <div class="pildora-p"><i class="moneda-p"></i><strong id="monedas">0</strong></div>
            <div class="pildora-p nivel-p"><span class="estrella-p"><b id="nivel">1</b></span><div class="barra-p"><i id="xp"></i></div></div>
        </div>
    </header>

    <div class="cuerpo-p">
        <section class="local">
            <canvas id="lienzo"></canvas>
            <div id="aviso" class="aviso-p" hidden></div>
            <p class="ayuda-local">Tocá un horno para hornear · tocá al cliente para venderle</p>
        </section>

        <div class="columna-p">
            <nav class="pestanas-p">
                <button class="pestana-p activa" data-p="recetas">🥐<small>Recetas</small></button>
                <button class="pestana-p" data-p="mejoras">⭐<small>Mejoras</small></button>
                <button class="pestana-p" data-p="personal">👩‍🍳<small>Personal</small></button>
                <button class="pestana-p" data-p="sucursal">🏪<small>Sucursal</small></button>
            </nav>
            <main id="panel" class="panel-p"></main>
        </div>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
