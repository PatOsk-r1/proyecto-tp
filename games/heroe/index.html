<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Héroe idle · Proyecto TP</title>
    <meta name="theme-color" content="#1b1035">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/solitario.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="pantalla-3d tema-heroe">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Héroe idle</h1>
        <button id="abrir-renacer" class="boton-almas" type="button">👻 <span id="almas">0</span></button>
    </header>

    <div class="info-juego">
        <div class="dato"><span>Etapa</span><strong id="etapa">1</strong></div>
        <div class="dato"><span>Oro</span><strong id="oro">0</strong></div>
        <div class="dato"><span>Por toque</span><strong id="por-toque">1</strong></div>
        <div class="dato"><span>Equipo/s</span><strong id="dps">0</strong></div>
    </div>

    <section class="escena">
        <canvas id="lienzo" class="lienzo-juego"></canvas>
        <div class="habilidades">
            <button id="hab-furia" class="habilidad" type="button">⚔️<small>Furia</small><i></i></button>
            <button id="hab-oro" class="habilidad" type="button">💰<small>Lluvia</small><i></i></button>
            <button id="hab-tormenta" class="habilidad" type="button">⚡<small>Tormenta</small><i></i></button>
            <button id="boton-mazmorra" class="habilidad mazmorra" type="button">🗝️<small>Mazmorra</small><b id="llaves">0</b></button>
        </div>
        <button id="avanzar" class="avanzar" type="button" hidden>⏩ Volver a avanzar</button>
    </section>

    <div class="pestanas pestanas-heroe">
        <button class="pestana activa" data-p="lista">⚔️<small>Equipo</small></button>
        <button class="pestana" data-p="botin">🎒<small>Botín</small><i class="novedad" hidden></i></button>
        <button class="pestana" data-p="mascotas">🐾<small>Mascotas</small><i class="novedad" hidden></i></button>
        <button class="pestana" data-p="cartas">🃏<small>Cartas</small><i class="novedad" hidden></i></button>
        <button class="pestana" data-p="reliquias">👻<small>Reliquias</small></button>
    </div>
    <div id="comprar-de" class="comprar-de">
        <span>Comprar de a</span>
        <button class="cantidad activa" data-cantidad="1">×1</button>
        <button class="cantidad" data-cantidad="10">×10</button>
        <button class="cantidad" data-cantidad="max">Máx</button>
    </div>
    <main id="lista" class="lista"></main>
    <main id="botin" class="lista" hidden></main>
    <main id="mascotas" class="lista" hidden></main>
    <main id="cartas" class="lista" hidden></main>
    <main id="reliquias" class="lista" hidden></main>

    <div id="renacer" class="hoja-fondo" hidden>
        <div class="hoja">
            <h2>👻 Renacer</h2>
            <p>Volvés a la etapa 1 y perdés el oro y el equipo, pero ganás <strong>almas</strong>. Cada alma suma <strong>+10% de daño</strong> para siempre y se pueden gastar en reliquias.</p>
            <p class="grande-s">Ganarías <strong id="almas-nuevas">0</strong> almas</p>
            <p class="chico-s" id="req-renacer">Se puede renacer desde la etapa 25.</p>
            <div class="botones-s">
                <button id="cancelar-renacer" class="accion secundaria" type="button">Ahora no</button>
                <button id="confirmar-renacer" class="accion" type="button">Renacer</button>
            </div>
        </div>
    </div>

    <div id="aviso" class="mensaje-centro" hidden></div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
