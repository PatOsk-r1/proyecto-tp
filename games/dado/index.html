<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dado · Proyecto TP</title>
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/originales.css">
    <style>
        .tema-dado { --acento: #2ee59d; }
        .resultado-dado {
            flex: 1;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .numero-dado {
            font-size: clamp(3.6rem, 19vw, 5.5rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.03em;
            transition: color 0.2s;
        }
        .numero-dado.salto { animation: salto-dado 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
        @keyframes salto-dado { from { transform: scale(0.85); } }
        .leyenda-dado { margin-top: 6px; font-size: 0.85rem; font-weight: 700; color: var(--texto-suave); }

        /* Barra 0-100 con la zona ganadora y el marcador del resultado */
        .pista {
            position: relative;
            height: 64px;
            margin: 0 6px 10px;
            touch-action: none;
        }
        .riel {
            position: absolute;
            left: 0;
            right: 0;
            top: 26px;
            height: 12px;
            border-radius: 999px;
            background: var(--pierde);
            overflow: hidden;
            box-shadow: inset 0 2px 4px #0006;
        }
        .zona-gana {
            position: absolute;
            top: 0;
            bottom: 0;
            background: var(--gana);
        }
        .tirador {
            position: absolute;
            top: 16px;
            width: 32px;
            height: 32px;
            margin-left: -16px;
            border-radius: 9px;
            background: linear-gradient(180deg, #fff, #c9d2e0);
            box-shadow: 0 4px 12px #0008;
            display: grid;
            place-items: center;
        }
        .tirador::before {
            content: "";
            width: 12px;
            height: 12px;
            background: repeating-linear-gradient(90deg, #8b96a8 0 2px, transparent 2px 5px);
        }
        .marcador {
            position: absolute;
            top: -8px;
            margin-left: -26px;
            width: 52px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 4px 0;
            border-radius: 8px;
            color: #04140d;
            background: var(--gana);
            transition: left 0.45s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.2s;
        }
        .marcador.pierde { background: var(--pierde); color: #fff; }
        .marcador::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -6px;
            margin-left: -6px;
            border: 6px solid transparent;
            border-bottom: 0;
            border-top-color: var(--gana);
        }
        .marcador.pierde::after { border-top-color: var(--pierde); }
        .marcador.oculto { opacity: 0; }
        .escala {
            position: absolute;
            left: 0;
            right: 0;
            top: 50px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--texto-suave);
        }
    </style>
</head>
<body class="pantalla-3d tema-casino tema-original tema-dado">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Dado</h1>
        <div id="fichas" class="fichas-total"></div>
    </header>

    <main class="zona-original">
        <div id="historial" class="historial-o"></div>
        <div class="resultado-dado">
            <div id="numero" class="numero-dado">50.00</div>
            <div id="leyenda" class="leyenda-dado">Mové la barra y tirá</div>
        </div>
        <div id="pista" class="pista">
            <div class="riel"><div id="zona" class="zona-gana"></div></div>
            <div id="tirador" class="tirador"></div>
            <div id="marcador" class="marcador oculto">0</div>
            <div class="escala"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
        </div>
        <div class="segmentos" id="modo">
            <button data-modo="mas" class="activo" type="button">Sacar más de</button>
            <button data-modo="menos" type="button">Sacar menos de</button>
        </div>
        <div class="datos-o">
            <div>Objetivo<strong id="objetivo">50.00</strong></div>
            <div>Chance<strong id="chance">50%</strong></div>
            <div>Paga<strong id="paga">1.98×</strong></div>
        </div>
    </main>

    <div class="controles-casino">
        <div class="apuesta-fila">
            <button id="menos" class="redondo" type="button">−</button>
            <div class="apuesta">Apuesta<strong id="apuesta">10</strong></div>
            <button id="mas" class="redondo" type="button">+</button>
        </div>
        <div class="fila-botones">
            <button id="accion" class="accion" type="button">Tirar</button>
            <div class="auto-o"><button id="auto" type="button">Auto</button></div>
        </div>
        <button id="recargar" class="accion secundaria" type="button" hidden>Recargar fichas</button>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
