<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mancala · Proyecto TP</title>
    <meta name="theme-color" content="#3b2414">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/tablero.css">
    <style>
        .tema-mancala {
            --fondo: #2a1608;
            --fondo-2: #5a3418;
            --texto-suave: #f0d9b5;
            --acento: #7ee0b0;
            --acento-2: #2fb37a;
            --panel: #1a0c04cc;
        }
        .tablero-m {
            width: min(100%, 560px);
            display: grid;
            grid-template-columns: 1.2fr repeat(6, 1fr) 1.2fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            padding: 10px;
            border-radius: 40px;
            background: linear-gradient(160deg, #a8743f, #6b3f1d);
            box-shadow: 0 14px 30px #000a, inset 0 2px 0 #ffffff44, inset 0 -6px 12px #0005;
        }
        .hoyo {
            position: relative;
            aspect-ratio: 1;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 50% 35%, #3a200c, #5a3418 70%);
            box-shadow: inset 0 6px 10px #000a;
            font: inherit;
            padding: 0;
        }
        .granero {
            grid-row: 1 / 3;
            aspect-ratio: auto;
            border-radius: 999px;
        }
        .hoyo.jugable {
            outline: 3px solid var(--acento);
            outline-offset: -3px;
            cursor: pointer;
        }
        .hoyo.recibe {
            box-shadow: inset 0 6px 10px #000a, 0 0 14px #ffd166;
        }
        .hoyo .cuenta {
            position: absolute;
            left: 50%;
            bottom: -2px;
            transform: translate(-50%, 50%);
            min-width: 22px;
            padding: 1px 6px;
            border-radius: 999px;
            background: #000c;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 900;
            z-index: 2;
        }
        .granero .cuenta {
            bottom: 50%;
            transform: translate(-50%, 50%);
            font-size: 1.1rem;
        }
        .semilla {
            position: absolute;
            width: 22%;
            aspect-ratio: 1;
            border-radius: 50%;
            box-shadow: inset -2px -2px 3px #0006, 0 1px 2px #0008;
        }
        .fila-etiqueta {
            width: min(100%, 560px);
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--texto-suave);
            padding: 0 14px;
        }
    </style>
</head>
<body class="pantalla-3d tema-mancala">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Mancala</h1>
    </header>

    <div class="marcador-turnos">
        <div id="j-yo" class="jugador-t"><span>Vos</span><span class="puntos-t">0</span></div>
        <span id="estado" class="estado-t">Tu turno</span>
        <div id="j-rival" class="jugador-t"><span>Rival</span><span class="puntos-t">0</span></div>
    </div>

    <main class="zona-tablero">
        <div class="fila-etiqueta"><span>⬅ Granero rival</span><span>Hoyos del rival</span></div>
        <div id="tablero" class="tablero-m"></div>
        <div class="fila-etiqueta"><span>Tus hoyos</span><span>Tu granero ➡</span></div>
        <div id="aviso" class="aviso-t">Tocá uno de tus hoyos para sembrar</div>

        <div id="centro" class="mensaje-centro">
            <div id="titulo-centro">Mancala<div class="chico">Sembrá semillas y juntá más que tu rival en tu granero</div></div>
            <div class="dificultad">
                <button data-nivel="0">Fácil</button>
                <button data-nivel="1">Normal</button>
                <button data-nivel="2">Difícil</button>
            </div>
            <button id="jugar" class="boton-grande" type="button">Jugar contra la compu</button>
            <a class="enlace-amigos" href="../../amigos.html">👥 Jugar con un amigo</a>
        </div>
    </main>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
