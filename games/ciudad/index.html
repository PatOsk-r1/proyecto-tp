<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ciudad · Proyecto TP</title>
    <meta name="theme-color" content="#1d3557">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <style>
        .tema-ciudad {
            --fondo: #0d1b2a;
            --fondo-2: #1d3557;
            --texto-suave: #cfe3ff;
            --acento: #ffd166;
            --acento-2: #f4a261;
            --panel: #08111dcc;
        }
        .boton-llaves { margin-left: auto; font: inherit; font-weight: 900; color: #1d3557; background: linear-gradient(180deg, #ffe08a, #f4a261); border: none; border-radius: 999px; padding: 8px 14px; box-shadow: 0 3px 0 #0008; }
        .mapa { position: relative; flex: 1; min-height: 0; }
        .mapa canvas { width: 100%; height: 100%; display: block; touch-action: manipulation; }
        .marcador-c { position: absolute; top: 6px; left: 0; right: 0; text-align: center; pointer-events: none; text-shadow: 0 2px 6px #000a; }
        .marcador-c .grande { font-size: 1.9rem; font-weight: 900; }
        .marcador-c .chico { font-size: 0.8rem; color: var(--texto-suave); font-weight: 700; }
        .panel-c { height: 36vh; min-height: 200px; overflow-y: auto; padding: 8px 10px calc(14px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--borde); display: flex; flex-direction: column; gap: 6px; }
        .titulo-c { font-size: 0.85rem; font-weight: 800; color: var(--texto-suave); text-align: center; }
        .fila-c { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: linear-gradient(160deg, #ffffff1a, #ffffff06); border: 1px solid #ffffff22; font: inherit; color: #fff; text-align: left; width: 100%; }
        .fila-c canvas { width: 46px; height: 46px; flex-shrink: 0; }
        .fila-c .txt { flex: 1; font-size: 0.86rem; font-weight: 800; }
        .fila-c .txt small { display: block; color: var(--texto-suave); font-weight: 600; font-size: 0.72rem; }
        .fila-c .precio { font-weight: 900; color: var(--acento); white-space: nowrap; }
        .fila-c:disabled { opacity: 0.42; }
        .botones-c { display: flex; gap: 8px; }
        .botones-c .accion { flex: 1; font-size: 0.9rem; padding: 11px 8px; }
        .hoja-fondo { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 20px; background: #000b; }
        .hoja { max-width: 420px; padding: 20px; border-radius: 20px; background: #1d3557; border: 2px solid var(--acento); text-align: center; display: flex; flex-direction: column; gap: 10px; }
        .hoja strong.grande { font-size: 2rem; color: var(--acento); }
        .hoja .botones { display: flex; gap: 8px; }
    </style>
</head>
<body class="pantalla-3d tema-ciudad">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Ciudad</h1>
        <button id="abrir-nueva" class="boton-llaves" type="button">🔑 <span id="llaves">0</span></button>
    </header>

    <section class="mapa">
        <canvas id="lienzo"></canvas>
        <div class="marcador-c">
            <div id="plata" class="grande">$0</div>
            <div id="por-segundo" class="chico">$0 por segundo · tocá un terreno</div>
        </div>
        <div id="aviso" class="mensaje-centro" hidden></div>
    </section>
    <div id="panel" class="panel-c"></div>

    <div id="nueva" class="hoja-fondo" hidden>
        <div class="hoja">
            <h2>🔑 Fundar otra ciudad</h2>
            <p>Empezás de cero en un terreno nuevo. Cada llave hace que <b>todo produzca un 15% más</b> para siempre.</p>
            <p>Conseguirías <strong id="llaves-nuevas" class="grande">0</strong></p>
            <div class="botones">
                <button id="cancelar-nueva" class="accion secundaria" type="button">Ahora no</button>
                <button id="confirmar-nueva" class="accion" type="button">Fundar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
