<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Video póker · Proyecto TP</title>
    <meta name="theme-color" content="#0a1f5c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <style>
        .tema-poker {
            --fondo: #06123a;
            --fondo-2: #0a2a7a;
            --texto-suave: #c4d4ff;
            --acento: #ffd166;
            --acento-2: #e0a020;
            --panel: #040c28cc;
        }
        .mesa {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 8px 10px;
            overflow: hidden;
        }
        .pagos {
            width: min(100%, 480px);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1px 10px;
            padding: 8px 12px;
            border-radius: 12px;
            background: #0008;
            border: 2px solid #ffd16655;
            font-size: clamp(0.72rem, 3vw, 0.9rem);
            font-weight: 800;
            color: #ffe9a8;
        }
        .pagos span:nth-child(even) { text-align: right; }
        .pagos .activa { color: #fff; background: #ffd16633; border-radius: 4px; }
        .mano {
            display: flex;
            gap: clamp(4px, 1.6vw, 10px);
            perspective: 800px;
        }
        .carta-p {
            position: relative;
            width: clamp(56px, 17vw, 96px);
            aspect-ratio: 0.7;
            border-radius: 9px;
            background: linear-gradient(160deg, #fff, #efeae0);
            color: #1a1a1a;
            border: none;
            font: inherit;
            box-shadow: 0 4px 10px #0008;
            transition: transform 0.15s;
        }
        .carta-p.roja { color: #d32f2f; }
        .carta-p.dorso { background: repeating-linear-gradient(45deg, #1e4fd8 0 6px, #163a9e 6px 12px); border: 3px solid #fff; }
        .carta-p.nueva { animation: dar-vuelta 0.35s ease-out; }
        .carta-p.guardada { transform: translateY(-10px); box-shadow: 0 0 0 3px #ffd166, 0 8px 16px #000a; }
        .carta-p .valor { position: absolute; top: 6%; left: 9%; font-size: clamp(0.9rem, 4.2vw, 1.4rem); font-weight: 900; line-height: 1; text-align: center; }
        .carta-p .centro { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(1.6rem, 8vw, 2.8rem); }
        .carta-p .guardar { position: absolute; bottom: -24px; left: 0; right: 0; font-size: 0.7rem; font-weight: 900; color: #ffd166; letter-spacing: 0.05em; }
        @keyframes dar-vuelta { from { transform: rotateY(90deg); } }
        .resultado-p { min-height: 1.6em; font-size: 1.3rem; font-weight: 900; text-align: center; }
        .resultado-p.gano { color: var(--acento); animation: aparecer 0.35s ease-out; }
        .ayuda-p { font-size: 0.8rem; color: var(--texto-suave); min-height: 1.2em; }
    </style>
</head>
<body class="pantalla-3d tema-casino tema-poker">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Video póker</h1>
        <div id="fichas" class="fichas-total"></div>
    </header>

    <main class="mesa">
        <div id="pagos" class="pagos"></div>
        <div id="resultado" class="resultado-p">Jacks or Better</div>
        <div id="mano" class="mano"></div>
        <div id="ayuda" class="ayuda-p">Apostá y repartí</div>
    </main>

    <div class="controles-casino">
        <div class="apuesta-fila">
            <button id="menos" class="redondo" type="button">−</button>
            <div class="apuesta">Apuesta<strong id="apuesta">10</strong></div>
            <button id="mas" class="redondo" type="button">+</button>
        </div>
        <button id="accion" class="accion" type="button">Repartir</button>
        <button id="recargar" class="accion secundaria" type="button" hidden>Recargar fichas</button>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
