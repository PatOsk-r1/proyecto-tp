<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Video póker · Proyecto TP</title>
    <meta name="theme-color" content="#0b2a4a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/casino-cartas.css">
    <style>
        #mesa { background: radial-gradient(ellipse at 50% 30%, #1d4f91, #0f2f5c 60%, #081a36); border-color: #c9a227; }
        #mesa.festejo { animation: festejo 0.25s 6 alternate; }
        @keyframes festejo { to { box-shadow: inset 0 0 60px #ffd166, 0 0 30px #ffd166; } }
        .tabla-vp {
            list-style: none;
            width: 100%;
            max-width: 360px;
            margin: 0;
            padding: 6px 10px;
            border-radius: 14px;
            background: #0007;
            border: 1px solid #ffd16655;
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 14px;
            font-size: 0.74rem;
            font-weight: 800;
        }
        .tabla-vp li { display: flex; justify-content: space-between; padding: 2px 0; color: #ffe8a3; transition: background 0.2s; }
        .tabla-vp li b { color: #fff; }
        .tabla-vp li.gano { background: #ffd166; color: #2a1400; border-radius: 6px; padding: 2px 6px; margin: 0 -6px; animation: brillo 0.6s 3 alternate; }
        .tabla-vp li.gano b { color: #2a1400; }
        @keyframes brillo { to { box-shadow: 0 0 14px #ffd166; } }
        .mano-vp { display: flex; gap: 6px; justify-content: center; }
        .carta-vp { position: relative; padding: 0; border: none; background: none; transition: transform 0.18s; font: inherit; }
        .carta-vp:disabled { opacity: 1; }
        .carta-vp .naipe { --w: min(64px, 17vw) !important; width: min(64px, 17vw); }
        .carta-vp.nueva .naipe { animation: entrar-vp 0.4s var(--d, 0ms) cubic-bezier(0.2, 1.4, 0.4, 1) backwards; }
        @keyframes entrar-vp { from { transform: translateY(-60px) rotateY(90deg); opacity: 0; } }
        .carta-vp.guardada { transform: translateY(-12px); }
        .carta-vp.guardada .naipe { box-shadow: 0 0 0 3px #ffd166, 0 8px 18px #000a; }
        .carta-vp .marca {
            position: absolute;
            left: 50%;
            bottom: -18px;
            transform: translateX(-50%);
            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #ffd166;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .carta-vp.guardada .marca { opacity: 1; }
    </style>
</head>
<body class="pantalla-3d tema-casino">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Video póker</h1>
        <div id="fichas" class="fichas-total"></div>
    </header>

    <main id="mesa" class="mesa-casino">
        <ul id="tabla" class="tabla-vp"></ul>
        <div id="mano" class="mano-vp"></div>
        <div id="mensaje" class="mensaje-casino">Jacks or Better: paga desde un par de J</div>
    </main>

    <div class="controles-casino">
        <div class="apuesta-fila">
            <button id="menos" class="redondo" type="button">−</button>
            <div class="apuesta">Apuesta<strong id="apuesta">10</strong></div>
            <button id="mas" class="redondo" type="button">+</button>
        </div>
        <button id="accion" class="accion" type="button">🃏 Repartir</button>
        <button id="recargar" class="accion secundaria" type="button" hidden>Recargar fichas</button>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
