<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Minas · Proyecto TP</title>
    <meta name="theme-color" content="#0b1d2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <style>
        .tema-minas {
            --fondo: #07131d;
            --fondo-2: #123048;
            --texto-suave: #c4e3f5;
            --acento: #4ef0b3;
            --acento-2: #14b885;
            --panel: #04101acc;
        }
        .zona-minas {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px;
        }
        .info-minas {
            display: flex;
            gap: 8px;
        }
        .info-minas div {
            min-width: 92px;
            padding: 6px 10px;
            border-radius: 12px;
            background: #ffffff10;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--texto-suave);
        }
        .info-minas strong { display: block; font-size: 1.2rem; color: var(--acento); }
        .grilla {
            width: min(92vw, 52vh, 440px);
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
            padding: 10px;
            border-radius: 20px;
            background: #0b2235;
            box-shadow: inset 0 0 24px #000a, 0 12px 30px #0009;
            perspective: 600px;
        }
        .baldosa {
            position: relative;
            border: none;
            border-radius: 12px;
            padding: 0;
            font: inherit;
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(0.3, 1.4, 0.5, 1);
            background: none;
        }
        .baldosa .tapa, .baldosa .fondo-b {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: grid;
            place-items: center;
        }
        .baldosa .tapa {
            background: linear-gradient(160deg, #2c5c80, #183a57);
            box-shadow: inset 0 2px 0 #ffffff33, 0 4px 0 #0a1a28;
        }
        .baldosa:not(:disabled):active .tapa { transform: translateY(3px); box-shadow: inset 0 2px 0 #ffffff33, 0 1px 0 #0a1a28; }
        .jugando .baldosa:not(.abierta):not(:disabled):hover .tapa { background: linear-gradient(160deg, #3a77a3, #1f4b70); }
        .baldosa .fondo-b {
            transform: rotateY(180deg);
            background: radial-gradient(circle, #123048, #0a1d2c);
            font-size: min(9vw, 2.4rem);
        }
        .baldosa.abierta { transform: rotateY(180deg); }
        .baldosa.gema .fondo-b { box-shadow: inset 0 0 0 2px #4ef0b388, 0 0 14px #4ef0b355; }
        .baldosa.bomba .fondo-b { background: radial-gradient(circle, #ff6b6b, #7a0010); }
        .bomba-svg { width: 66%; filter: drop-shadow(0 0 6px #ff7a1a); }
        .baldosa.revelada .fondo-b > * { opacity: 0.45; }
        .gema-svg { width: 62%; filter: drop-shadow(0 0 6px #4ef0b3); animation: brillar-gema 1.4s ease-in-out infinite; }
        @keyframes brillar-gema { 50% { filter: drop-shadow(0 0 14px #4ef0b3); } }
        .grilla.temblor { animation: temblor 0.4s; }
        @keyframes temblor { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
        .elegir-minas {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--texto-suave);
        }
        .elegir-minas button {
            font: inherit;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--texto);
            background: #ffffff14;
            border: 2px solid #ffffff22;
            border-radius: 999px;
            padding: 4px 11px;
        }
        .elegir-minas button.activa { border-color: var(--acento); color: var(--acento); }
        .elegir-minas button:disabled:not(.activa) { opacity: 0.4; }
        #accion { color: #032; }
        #accion.cobrar { background: linear-gradient(180deg, #b7ffdf, #2fbf8a); animation: latir 0.8s ease-in-out infinite; }
    </style>
</head>
<body class="pantalla-3d tema-casino tema-minas">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Minas</h1>
        <div id="fichas" class="fichas-total"></div>
    </header>

    <main class="zona-minas">
        <div class="info-minas">
            <div>Multiplicador<strong id="multi">1.00×</strong></div>
            <div>Próxima gema<strong id="proximo">—</strong></div>
            <div>Ganancia<strong id="ganancia">0</strong></div>
        </div>
        <div id="grilla" class="grilla"></div>
    </main>

    <div class="controles-casino">
        <div class="elegir-minas">
            Bombas:
            <button data-minas="1">1</button>
            <button data-minas="3" class="activa">3</button>
            <button data-minas="5">5</button>
            <button data-minas="10">10</button>
            <button data-minas="20">20</button>
        </div>
        <div class="apuesta-fila">
            <button id="menos" class="redondo" type="button">−</button>
            <div class="apuesta">Apuesta<strong id="apuesta">10</strong></div>
            <button id="mas" class="redondo" type="button">+</button>
        </div>
        <button id="accion" class="accion" type="button">💎 Empezar</button>
        <button id="recargar" class="accion secundaria" type="button" hidden>Recargar fichas</button>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
