<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Acuario · Proyecto TP</title>
    <meta name="theme-color" content="#023e8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="pantalla-3d tema-acuario">
    <header class="barra-juego barra-acuario">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Acuario</h1>
        <div class="hud-acuario">
            <div class="pildora-a"><i class="moneda-a"></i><strong id="monedas">0</strong></div>
            <div class="pildora-a"><span>👀</span><strong id="visitas">0</strong><small>/min</small></div>
        </div>
    </header>

    <div class="cuerpo-a">
        <section class="pecera">
            <canvas id="lienzo"></canvas>
            <div class="medidores-a">
                <div class="medidor-a"><span>😊</span><div class="barra-a"><i id="felicidad"></i></div></div>
                <div class="medidor-a"><span>💧</span><div class="barra-a agua"><i id="agua"></i></div></div>
                <div class="medidor-a"><span>🐟</span><b id="poblacion">0/10</b></div>
            </div>
            <button id="limpiar" class="limpiar-a" type="button">🧽 Limpiar</button>
            <p class="ayuda-pecera">Tocá el agua para darles de comer · tocá un pez para verlo</p>
            <div id="ficha" class="ficha-pez" hidden></div>
            <div id="aviso" class="aviso-a" hidden></div>
        </section>

        <div class="columna-a">
            <nav class="pestanas-a">
                <button class="pestana-a activa" data-p="peces">🐠<small>Peces</small></button>
                <button class="pestana-a" data-p="deco">🌿<small>Plantas y deco</small></button>
                <button class="pestana-a" data-p="equipo">⚙️<small>Equipo</small></button>
                <button class="pestana-a" data-p="mios">📋<small>Mi pecera</small></button>
            </nav>
            <main id="panel" class="panel-a"></main>
        </div>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
