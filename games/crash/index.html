<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Crash · Proyecto TP</title>
    <meta name="theme-color" content="#07041a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <style>
        .tema-crash {
            --fondo: #07041a;
            --fondo-2: #1a0b45;
            --texto-suave: #cfc6ff;
            --acento: #7df9ff;
            --acento-2: #3a86ff;
            --panel: #05031acc;
        }
        .zona-crash {
            position: relative;
            flex: 1;
            min-height: 0;
            margin: 0 10px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #ffffff1c;
            box-shadow: inset 0 0 40px #0008;
        }
        .zona-crash canvas { width: 100%; height: 100%; display: block; }
        .multi {
            position: absolute;
            top: 16%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 3.4rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 4px 16px #000c;
            pointer-events: none;
        }
        .multi.exploto { color: #ff4d6d; animation: aparecer 0.3s ease-out; }
        .multi.cobrado { color: #7ee08f; }
        .multi small { display: block; font-size: 0.9rem; color: var(--texto-suave); }
        .historial-c {
            display: flex;
            gap: 4px;
            padding: 6px 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .historial-c span {
            flex-shrink: 0;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 900;
            background: #ffffff14;
        }
        .historial-c span.bajo { color: #ff8fa3; }
        .historial-c span.medio { color: #ffd166; }
        .historial-c span.alto { color: #7ee08f; background: #7ee08f22; }
        .auto-retiro {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--texto-suave);
        }
        .auto-retiro button {
            font: inherit;
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--texto);
            background: #ffffff14;
            border: 2px solid #ffffff22;
            border-radius: 999px;
            padding: 4px 10px;
        }
        .auto-retiro button.activo { border-color: var(--acento); color: var(--acento); }
        #accion.retirar {
            background: linear-gradient(180deg, #b7ffbf, #2fbf71);
            color: #032;
            animation: latir 0.6s ease-in-out infinite;
        }
        #accion { color: #050318; font-size: 1.15rem; }
    </style>
</head>
<body class="pantalla-3d tema-casino tema-crash">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Crash</h1>
        <div id="fichas" class="fichas-total"></div>
    </header>

    <div id="historial" class="historial-c"></div>

    <main class="zona-crash">
        <canvas id="lienzo"></canvas>
        <div id="multi" class="multi">1.00×<small>Apostá y despegá</small></div>
    </main>

    <div class="controles-casino">
        <div class="auto-retiro">
            Retiro automático:
            <button data-auto="0" class="activo">No</button>
            <button data-auto="1.5">1.5×</button>
            <button data-auto="2">2×</button>
            <button data-auto="5">5×</button>
            <button data-auto="10">10×</button>
        </div>
        <div class="apuesta-fila">
            <button id="menos" class="redondo" type="button">−</button>
            <div class="apuesta">Apuesta<strong id="apuesta">10</strong></div>
            <button id="mas" class="redondo" type="button">+</button>
        </div>
        <button id="accion" class="accion" type="button">🚀 Despegar</button>
        <button id="recargar" class="accion secundaria" type="button" hidden>Recargar fichas</button>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
