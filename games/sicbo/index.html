<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sic Bo · Proyecto TP</title>
    <meta name="theme-color" content="#5a0b0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <style>
        .tema-sicbo {
            --fondo: #2a0404;
            --fondo-2: #6b0f0f;
            --texto-suave: #ffd6cc;
            --acento: #ffd166;
            --acento-2: #e0a020;
            --panel: #1a0202cc;
        }
        .zona-s { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 10px; overflow-y: auto; }
        .cubilete { display: flex; gap: 18px; justify-content: center; perspective: 600px; height: 84px; align-items: center; }
        .cubilete.agitando { animation: agitar 0.12s linear infinite; }
        @keyframes agitar { 25% { transform: translate(-4px, 2px) rotate(-3deg); } 75% { transform: translate(4px, -2px) rotate(3deg); } }
        .dado { position: relative; width: 56px; height: 56px; transform-style: preserve-3d; transition: transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1); }
        .cara-dado { position: absolute; inset: 0; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 6px; border-radius: 11px; background: linear-gradient(145deg, #fff, #e9e4dc); box-shadow: inset 0 0 8px #0003; backface-visibility: hidden; }
        .cara-dado i { width: 10px; height: 10px; margin: auto; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #444, #000); }
        .cara-dado.uno i, .cara-dado.cuatro i { background: radial-gradient(circle at 35% 35%, #ff6b6b, #a4161a); }
        .resultado-s { min-height: 1.4em; font-size: 1.15rem; font-weight: 900; text-align: center; text-shadow: 0 2px 6px #000a; }
        .resultado-s.gano { color: var(--acento); animation: aparecer 0.3s ease-out; }
        .pano-s { width: min(100%, 480px); display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 6px; border-radius: 16px; background: radial-gradient(ellipse at 50% 30%, #1c8a4e, #0b4a26 80%); border: 4px solid #5a2e10; }
        .casilla-s {
            position: relative;
            min-height: 44px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3px 2px;
            font: inherit;
            font-weight: 900;
            font-size: 0.82rem;
            color: #fff;
            background: #00000040;
            border: 1px solid #ffffff44;
            border-radius: 8px;
        }
        .casilla-s small { font-size: 0.58rem; color: #ffe8a3; font-weight: 800; }
        .casilla-s.ancha { grid-column: span 3; min-height: 54px; font-size: 1rem; }
        .casilla-s.media { grid-column: span 4; }
        .casilla-s.gana { background: #ffd16655; box-shadow: 0 0 12px #ffd166; }
        .casilla-s .apostado {
            position: absolute; top: 50%; left: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%;
            display: grid; place-items: center; font-size: 0.5rem; color: #fff; text-shadow: 0 1px 2px #000;
            background: radial-gradient(circle, var(--c) 52%, transparent 53%), repeating-conic-gradient(var(--c) 0 30deg, #fff 30deg 60deg);
            box-shadow: 0 2px 4px #000a; animation: poner 0.2s ease-out;
        }
        @keyframes poner { from { transform: translateY(-12px) scale(1.4); opacity: 0; } }
        .mini-dado { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; background: #fff; color: #a4161a; font-size: 0.72rem; }
        .historial-s { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; min-height: 22px; }
        .historial-s span { padding: 2px 7px; border-radius: 8px; font-size: 0.72rem; font-weight: 900; background: #0006; }
        .historial-s span.chico { color: #7df9ff; }
        .historial-s span.grande { color: #ff8fa3; }
        .historial-s span.triple { color: #ffd166; }
        .botones-s { display: flex; gap: 8px; }
        .botones-s .accion { flex: 1; }
        .botones-s #tirar { flex: 2; }
    </style>
</head>
<body class="pantalla-3d tema-casino tema-sicbo">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Sic Bo</h1>
        <div id="fichas" class="fichas-total"></div>
    </header>

    <main class="zona-s">
        <div id="historial" class="historial-s"></div>
        <div id="cubilete" class="cubilete"><div class="dado"></div><div class="dado"></div><div class="dado"></div></div>
        <div id="resultado" class="resultado-s">Poné fichas y tirá los tres dados</div>
        <div id="pano" class="pano-s"></div>
    </main>

    <div class="controles-casino">
        <div class="apuesta-fila">
            <button id="menos" class="redondo" type="button">−</button>
            <div class="apuesta">Ficha<strong id="apuesta">10</strong></div>
            <button id="mas" class="redondo" type="button">+</button>
        </div>
        <div class="botones-s">
            <button id="borrar" class="accion secundaria" type="button">Borrar</button>
            <button id="tirar" class="accion" type="button">🎲 Tirar</button>
        </div>
        <button id="recargar" class="accion secundaria" type="button" hidden>Recargar fichas</button>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
