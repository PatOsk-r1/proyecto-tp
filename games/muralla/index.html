<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Muralla · Proyecto TP</title>
    <meta name="theme-color" content="#2d3a1f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/solitario.css">
    <style>
        .tema-muralla {
            --fondo: #1b2410;
            --fondo-2: #3d4f24;
            --texto-suave: #e6eccf;
            --acento: #ffd166;
            --acento-2: #f4a261;
            --panel: #10160acc;
        }
        .tema-muralla .boton-grande { color: #2a1a00; }
        .zona-juego { padding: 0; }
        .tienda-m { justify-content: flex-start; padding-top: 14px; overflow-y: auto; pointer-events: auto; gap: 10px; }
        .lista-m { width: min(100%, 420px); display: flex; flex-direction: column; gap: 6px; }
        .item-m { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font: inherit; text-align: left; color: #fff; background: #ffffff14; border: 1px solid #ffffff2a; border-radius: 14px; }
        .item-m .ico { font-size: 1.4rem; width: 32px; text-align: center; }
        .item-m .txt { flex: 1; font-size: 0.85rem; font-weight: 800; }
        .item-m .txt small { display: block; color: var(--texto-suave); font-weight: 600; }
        .item-m .precio { font-weight: 900; color: var(--acento); white-space: nowrap; }
        .item-m:disabled { opacity: 0.45; }
        .sub-m { font-size: 0.85rem; color: var(--texto-suave); }
        .enlace-m { pointer-events: auto; font: inherit; font-weight: 900; font-size: 1rem; color: #fff; background: #6f4518; border: none; border-radius: 999px; padding: 10px 18px; }
    </style>
</head>
<body class="pantalla-3d tema-muralla">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Muralla</h1>
    </header>

    <div class="info-juego">
        <div class="dato"><span>Oleada</span><strong id="oleada">0</strong></div>
        <div class="dato"><span>Muralla</span><strong id="vida">100</strong></div>
        <div class="dato"><span>Oro</span><strong id="oro">0</strong></div>
        <div class="dato"><span>Gemas</span><strong id="gemas">0</strong></div>
    </div>

    <main class="zona-juego">
        <canvas id="lienzo" class="lienzo-juego"></canvas>
        <div id="menu" class="mensaje-centro">
            <div id="titulo-menu">Muralla<div class="chico">Mantené el dedo apretado para apuntar: la ballesta dispara sola. Entre oleadas comprás mejoras.</div></div>
            <button id="jugar" class="boton-grande" type="button">Defender</button>
            <button id="abrir-forja" class="enlace-m" type="button">⚒️ Forja</button>
        </div>
        <div id="tienda" class="mensaje-centro tienda-m" hidden>
            <div id="titulo-tienda">Oleada superada</div>
            <div class="sub-m">🪙 <b id="oro-tienda">0</b> · tocá una mejora para comprarla</div>
            <div id="lista" class="lista-m"></div>
            <button id="seguir" class="boton-grande" type="button">⚔️ Siguiente oleada</button>
        </div>
        <div id="forja" class="mensaje-centro tienda-m" hidden>
            <div>⚒️ Forja <span style="color:#7df9ff;font-size:1rem">💎 <b id="gemas-forja">0</b></span></div>
            <div class="sub-m">Mejoras permanentes</div>
            <div id="lista-forja" class="lista-m"></div>
            <button id="cerrar-forja" class="boton-grande" type="button">Listo</button>
        </div>
    </main>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
