<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Minigolf · Proyecto TP</title>
    <meta name="theme-color" content="#1b4332">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/solitario.css">
    <style>
        .tema-golf {
            --fondo: #0b2a1e;
            --fondo-2: #2d6a4f;
            --texto-suave: #d8f3dc;
            --acento: #ffd23f;
            --acento-2: #ff9f1c;
            --panel: #051a12cc;
        }
        .zona-juego { padding: 6px; }
        .tarjeta-golpes { font-size: 0.9rem; line-height: 1.6; }
    </style>
</head>
<body class="pantalla-3d tema-golf">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Minigolf</h1>
    </header>

    <div class="info-juego">
        <div class="dato"><span>Hoyo</span><strong id="hoyo">1/9</strong></div>
        <div class="dato"><span>Par</span><strong id="par">2</strong></div>
        <div class="dato"><span>Golpes</span><strong id="golpes">0</strong></div>
        <div class="dato"><span>Total</span><strong id="total">0</strong></div>
    </div>

    <main class="zona-juego">
        <canvas id="lienzo" class="lienzo-juego"></canvas>
        <div id="centro" class="mensaje-centro">
            <div id="titulo-centro">Minigolf<div class="chico">Arrastrá hacia atrás desde cualquier lugar para apuntar y soltá para pegarle. 9 hoyos.</div></div>
            <button id="jugar" class="boton-grande" type="button">Jugar</button>
            <div id="mejor" class="chico"></div>
        </div>
    </main>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
