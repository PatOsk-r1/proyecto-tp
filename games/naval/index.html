<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Batalla naval · Proyecto TP</title>
    <meta name="theme-color" content="#03305c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/tablero.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="pantalla-3d tema-naval tema-casino">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Batalla naval</h1>
    </header>

    <div class="marcador-turnos">
        <div id="j-yo" class="jugador-t"><span>Vos</span><span class="puntos-t">0</span></div>
        <span id="estado" class="estado-t">Ubicá tu flota</span>
        <div id="j-rival" class="jugador-t"><span>Rival</span><span class="puntos-t">0</span></div>
    </div>

    <main class="zona-tablero">
        <div id="titulo-arriba" class="titulo-tablero">Tu flota</div>
        <div id="arriba" class="mar grande"></div>
        <div id="aviso" class="aviso-t"></div>
        <div id="botones-colocar" class="botones-colocar">
            <button id="mezclar" class="accion secundaria" type="button">🔀 Mezclar</button>
            <button id="listo" class="accion" type="button">✅ Listo</button>
        </div>
        <div id="titulo-abajo" class="titulo-tablero" hidden>Tu flota</div>
        <div id="abajo" class="mar chico" hidden></div>

        <div id="centro" class="mensaje-centro">
            <div id="titulo-centro">Batalla naval<div class="chico">Hundí los 5 barcos del rival. Si acertás, tirás de nuevo.</div></div>
            <div class="dificultad">
                <button data-nivel="0">Fácil</button>
                <button data-nivel="1">Normal</button>
                <button data-nivel="2">Difícil</button>
            </div>
            <button id="jugar" class="boton-grande" type="button">Jugar contra la compu</button>
            <a class="enlace-amigos" href="../../amigos.html">👥 Jugar con un amigo</a>
        </div>
    </main>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
