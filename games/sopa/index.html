<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sopa de letras · Proyecto TP</title>
    <meta name="theme-color" content="#7a3e00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/solitario.css">
    <style>
        .tema-sopa {
            --fondo: #2b1400;
            --fondo-2: #7a3e00;
            --texto-suave: #ffe2c2;
            --acento: #ffd23f;
            --acento-2: #ff9f1c;
            --panel: #1c0d00cc;
        }
        .tema-sopa .boton-grande { color: #2b1400; }
        .hoja {
            position: relative;
            width: min(94vw, 52vh, 460px);
            aspect-ratio: 1;
            border-radius: 14px;
            background: #fffaf0;
            box-shadow: 0 14px 30px #000a;
            touch-action: none;
            user-select: none;
        }
        .letras {
            position: absolute;
            inset: 6px;
            display: grid;
        }
        .letra {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #3b2414;
            z-index: 2;
        }
        .letra.elegida { color: #fff; }
        #marcas { position: absolute; inset: 6px; z-index: 1; pointer-events: none; }
        .palabras {
            width: min(94vw, 460px);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        .palabra {
            padding: 4px 10px;
            border-radius: 999px;
            background: #ffffff18;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.04em;
        }
        .palabra.hallada {
            text-decoration: line-through;
            opacity: 0.55;
            background: var(--c);
            color: #2b1400;
        }
        .tema-elegido { font-size: 0.9rem; font-weight: 800; color: var(--acento); }
    </style>
</head>
<body class="pantalla-3d tema-sopa">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Sopa de letras</h1>
    </header>

    <div class="info-juego">
        <div class="dato"><span>Encontradas</span><strong id="encontradas">0/8</strong></div>
        <div class="dato"><span>Tiempo</span><strong id="tiempo">0:00</strong></div>
        <div class="dato"><span>Completadas</span><strong id="completadas">0</strong></div>
    </div>

    <main class="zona-juego">
        <div id="tema" class="tema-elegido"></div>
        <div id="hoja" class="hoja"><svg id="marcas"></svg><div id="letras" class="letras"></div></div>
        <div id="palabras" class="palabras"></div>
        <div id="centro" class="mensaje-centro">
            <div id="titulo-centro">Sopa de letras<div class="chico">Deslizá el dedo sobre las letras para marcar cada palabra</div></div>
            <div class="dificultad">
                <button data-nivel="0">Fácil</button>
                <button data-nivel="1">Medio</button>
                <button data-nivel="2">Difícil</button>
            </div>
            <button id="jugar" class="boton-grande" type="button">Jugar</button>
        </div>
    </main>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
