<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Baccarat · Proyecto TP</title>
    <meta name="theme-color" content="#0b3d24">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/casino-cartas.css">
    <style>
        .mano-b { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .mano-b .titulo-b { display: flex; align-items: center; gap: 8px; font-weight: 900; letter-spacing: 0.08em; }
        .mano-b .titulo-b.jugador { color: #7df9ff; }
        .mano-b .titulo-b.banca { color: #ff8fa3; }
        .puntos-b { min-width: 34px; padding: 2px 10px; border-radius: 999px; background: #000a; color: var(--acento); text-align: center; }
        .cartas-b { display: flex; justify-content: center; min-height: 112px; }
        .cartas-b .naipe { margin-left: -18px; }
        .cartas-b .naipe:first-child { margin-left: 0; }
        .cartas-b .naipe.tercera { transform: rotate(90deg) translateX(10px); }
        .mano-b.gana .cartas-b .naipe { box-shadow: 0 0 0 3px var(--acento), 0 0 20px var(--acento); }
        .camino { display: grid; grid-template-rows: repeat(5, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 2px; padding: 6px; border-radius: 10px; background: #fff; min-height: 86px; max-width: 100%; overflow-x: auto; }
        .camino span { width: 14px; height: 14px; border-radius: 50%; font-size: 0.55rem; font-weight: 900; color: #fff; display: grid; place-items: center; }
        .camino .J { background: #1982c4; }
        .camino .B { background: #e63946; }
        .camino .E { background: #2a9d8f; }
        .apuestas-b { display: grid; grid-template-columns: 1fr 0.8fr 1fr; gap: 6px; width: 100%; }
        .lado-b { display: flex; flex-direction: column; align-items: center; padding: 10px 4px; font: inherit; font-weight: 900; color: #fff; border: 2px solid #ffffff33; border-radius: 14px; }
        .lado-b small { font-size: 0.7rem; opacity: 0.85; }
        .lado-b[data-lado=jugador] { background: linear-gradient(180deg, #1982c4, #0b3c5d); }
        .lado-b[data-lado=empate] { background: linear-gradient(180deg, #2a9d8f, #134e48); }
        .lado-b[data-lado=banca] { background: linear-gradient(180deg, #e63946, #6a040f); }
        .lado-b.elegido { border-color: var(--acento); box-shadow: 0 0 14px #ffd16688; transform: scale(1.04); }
        .lado-b:disabled:not(.elegido) { opacity: 0.5; }
    </style>
</head>
<body class="pantalla-3d tema-casino">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Baccarat</h1>
        <div id="fichas" class="fichas-total"></div>
    </header>

    <main class="mesa-casino">
        <div id="mano-banca" class="mano-b">
            <div class="titulo-b banca">BANCA <span id="puntos-banca" class="puntos-b">0</span></div>
            <div id="cartas-banca" class="cartas-b"></div>
        </div>
        <div id="mensaje" class="mensaje-casino">Apostá a Jugador, Banca o Empate</div>
        <div id="mano-jugador" class="mano-b">
            <div id="cartas-jugador" class="cartas-b"></div>
            <div class="titulo-b jugador">JUGADOR <span id="puntos-jugador" class="puntos-b">0</span></div>
        </div>
        <div id="camino" class="camino"></div>
    </main>

    <div class="controles-casino">
        <div class="apuestas-b">
            <button class="lado-b elegido" data-lado="jugador" type="button">Jugador<small>paga 1 a 1</small></button>
            <button class="lado-b" data-lado="empate" type="button">Empate<small>paga 8 a 1</small></button>
            <button class="lado-b" data-lado="banca" type="button">Banca<small>paga 0.95 a 1</small></button>
        </div>
        <div class="apuesta-fila">
            <button id="menos" class="redondo" type="button">−</button>
            <div class="apuesta">Apuesta<strong id="apuesta">10</strong></div>
            <button id="mas" class="redondo" type="button">+</button>
        </div>
        <button id="repartir" class="accion" type="button">🃏 Repartir</button>
        <button id="recargar" class="accion secundaria" type="button" hidden>Recargar fichas</button>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
