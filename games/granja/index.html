<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Granja · Proyecto TP</title>
    <meta name="theme-color" content="#5a3a1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/solitario.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="pantalla-3d tema-granja">
    <header class="barra-juego barra-granja">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Granja</h1>
        <div class="hud-g">
            <div class="pildora-g"><i class="moneda-g"></i><strong id="monedas">0</strong></div>
            <div class="pildora-g nivel-g">
                <span class="estrella-g"><b id="nivel">1</b></span>
                <div class="barra-xp"><div id="xp"></div></div>
            </div>
            <div class="pildora-g"><span class="ico-g">🏠</span><strong id="granero">0</strong></div>
        </div>
        <button id="ajustes" class="boton-ajustes" type="button" aria-label="Ajustes">⚙️</button>
    </header>

    <div id="hoja-ajustes" class="fondo-ajustes" hidden>
        <div class="ajustes-g" role="dialog" aria-label="Ajustes">
            <h2>⚙️ Ajustes</h2>
            <label class="control-vol">
                <span>🎵 Música</span>
                <input id="vol-musica" type="range" min="0" max="100" step="1">
                <b id="txt-musica"></b>
            </label>
            <label class="control-vol">
                <span>🔊 Sonidos</span>
                <input id="vol-efectos" type="range" min="0" max="100" step="1">
                <b id="txt-efectos"></b>
            </label>
            <label class="control-fps"><input id="mostrar-fps" type="checkbox"> Mostrar cuadros por segundo</label>
            <button id="cerrar-ajustes" class="boton-verde ancho" type="button">Listo</button>
            <small id="version-app" class="version-g"></small>
        </div>
    </div>

    <div class="cuerpo-g">
        <section class="campo">
            <canvas id="lienzo" class="lienzo-juego"></canvas>
            <div id="aviso" class="aviso-granja" hidden></div>
            <div id="estacion" class="estacion-g"></div>
            <button id="boton-mision" class="mision-g" type="button" hidden></button>
            <div id="medidor-fps" class="medidor-fps" hidden></div>        </section>

        <div class="columna-g">
            <!-- En pantallas grandes los pedidos quedan siempre a la vista -->
            <aside class="lado-g">
                <h2>📋 Pedidos</h2>
                <!-- Quien pide, dibujado, diciendo lo que quiere -->
                <div id="visita" class="visita-g">
                    <canvas id="persona" class="persona-g"></canvas>
                    <div class="globo-g"><b id="visita-nombre"></b><span id="visita-texto"></span></div>
                </div>
                <div id="pedidos-lado" class="lista-pedidos"></div>
            </aside>
            <nav class="pestanas-g">
                <button class="pestana-g activa" data-p="semillas">🌱<small>Semillas</small></button>
                <button class="pestana-g solo-celular" data-p="pedidos">📋<small>Pedidos</small><i id="pedidos-listos" hidden></i></button>
                <button class="pestana-g" data-p="almacen">🏠<small>Granero</small></button>
                <button class="pestana-g" data-p="animales">🐔<small>Animales</small></button>
                <button class="pestana-g" data-p="taller">🏭<small>Taller</small><i id="taller-listo" hidden></i></button>
                <button class="pestana-g" data-p="mejoras">⭐<small>Mejoras</small></button>
                <button id="boton-garra" class="pestana-garra" type="button" aria-label="Garra de premios">🕹️<small>Garra</small><b id="tiros-garra">0</b></button>
            </nav>
            <main id="panel" class="panel-g"></main>
        </div>
    </div>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
