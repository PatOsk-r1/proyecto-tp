<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Damas · Proyecto TP</title>
    <meta name="theme-color" content="#2b1a0e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../../icons/icon-180.png">
    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="stylesheet" href="../../css/juegos3d.css">
    <link rel="stylesheet" href="../../css/tablero.css">
    <style>
        .tema-damas {
            --fondo: #1c1009;
            --fondo-2: #4a2c16;
            --texto-suave: #f0d9b5;
            --acento: #ffd23f;
            --acento-2: #ff9f1c;
            --panel: #120904cc;
        }
        .damero {
            position: relative;
            width: min(94vw, 58vh, 480px);
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 10px solid #5a3418;
            border-radius: 10px;
            box-shadow: 0 16px 34px #000a, inset 0 0 0 2px #00000055;
        }
        .casilla-d {
            position: relative;
            border: none;
            padding: 0;
            background: #f0d9b5;
        }
        .casilla-d.oscura { background: #8a5a35; }
        .casilla-d.destino::after {
            content: "";
            position: absolute;
            inset: 34%;
            border-radius: 50%;
            background: #ffd23fcc;
            box-shadow: 0 0 10px #ffd23f;
        }
        .casilla-d.ultima { box-shadow: inset 0 0 0 3px #ffd23f88; }
        .ficha-d {
            position: absolute;
            left: 10%;
            top: 10%;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.9rem, 4.5vw, 1.6rem);
            pointer-events: none;
            transition: transform 0.18s ease-out;
            z-index: 2;
        }
        .ficha-d.roja {
            background: radial-gradient(circle at 35% 30%, #ff8a80, #d62828 55%, #8e1414);
            box-shadow: 0 4px 0 #5a0b0b, 0 6px 8px #0008, inset 0 0 0 4px #ffffff22;
            color: #ffe08a;
        }
        .ficha-d.negra {
            background: radial-gradient(circle at 35% 30%, #6b6b78, #26262e 55%, #0d0d12);
            box-shadow: 0 4px 0 #000, 0 6px 8px #0008, inset 0 0 0 4px #ffffff18;
            color: #ffd23f;
        }
        .ficha-d.elegida { outline: 3px solid #ffd23f; outline-offset: 2px; }
        .ficha-d.puede { box-shadow: 0 0 0 3px #7ee08f, 0 6px 8px #0008; }
        .ficha-d.elegida { animation: elegir 0.9s ease-in-out infinite; }
        @keyframes elegir { 50% { transform: translateY(-4px) scale(1.06); } }
        .ficha-d.comida { animation: comida 0.35s ease-in forwards; }
        @keyframes comida { to { transform: scale(0) rotate(180deg); opacity: 0; } }
        .ficha-d.corona { animation: corona 0.8s cubic-bezier(0.2, 1.6, 0.4, 1); box-shadow: 0 0 0 3px #ffd23f, 0 0 22px #ffd23f; }
        @keyframes corona { 0% { transform: scale(0.6) rotate(-20deg); } 60% { transform: scale(1.25) rotate(8deg); } }
        .ficha-volando { position: fixed; z-index: 10; pointer-events: none; margin: 0; }
        .flotante-d { position: fixed; z-index: 11; transform: translate(-50%, -50%); font-weight: 900; font-size: 1.3rem; color: #ffd23f; text-shadow: 0 2px 6px #000; pointer-events: none; animation: subir-d 1.1s ease-out forwards; }
        @keyframes subir-d { from { opacity: 0; transform: translate(-50%, -20%) scale(0.6); } 25% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } to { opacity: 0; transform: translate(-50%, -180%); } }
        .chispa-d { position: fixed; z-index: 10; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body class="pantalla-3d tema-damas">
    <header class="barra-juego">
        <a class="boton-volver" href="../../">‹ Juegos</a>
        <h1>Damas</h1>
    </header>

    <div class="marcador-turnos">
        <div id="j-yo" class="jugador-t"><span>Vos</span><span class="puntos-t">12</span></div>
        <span id="estado" class="estado-t">Tu turno</span>
        <div id="j-rival" class="jugador-t"><span>Rival</span><span class="puntos-t">12</span></div>
    </div>

    <main class="zona-tablero">
        <div id="damero" class="damero"></div>
        <div id="aviso" class="aviso-t">Tocá una ficha y después adónde moverla</div>

        <div id="centro" class="mensaje-centro">
            <div id="titulo-centro">Damas<div class="chico">Comer es obligatorio · podés comer varias seguidas · coroná en el fondo</div></div>
            <div class="dificultad">
                <button data-nivel="0">Fácil</button>
                <button data-nivel="1">Normal</button>
                <button data-nivel="2">Difícil</button>
            </div>
            <button id="jugar" class="boton-grande" type="button">Jugar contra la compu</button>
            <a class="enlace-amigos" href="../../amigos.html">👥 Jugar con un amigo</a>
        </div>
    </main>

    <script type="module">
        import { exigirSesion } from "../../js/sesion.js";
        exigirSesion();
    </script>
    <script type="module" src="juego.js"></script>
</body>
</html>
