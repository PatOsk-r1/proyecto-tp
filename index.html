<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Proyecto TP</title>
    <meta name="description" content="Colección de juegos de Proyecto TP">
    <meta name="theme-color" content="#1b1440">

    <!-- Instalación en iPhone (Compartir → Agregar a inicio) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Proyecto TP">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="encabezado">
        <div>
            <h1>Proyecto TP</h1>
            <p id="saludo">Elegí un juego</p>
        </div>
        <button id="salir" class="boton-texto" type="button">Salir</button>
    </header>

    <nav class="pestanas" role="tablist">
        <button class="pestana" data-seccion="solo" role="tab">🎮 Solo</button>
        <button class="pestana" data-seccion="multi" role="tab">👥 Multijugador<span id="pendientes" class="insignia chica" hidden></span></button>
        <button class="pestana" data-seccion="casino" role="tab">🎰 Casino</button>
    </nav>

    <main>
        <section id="seccion-multi" class="seccion" hidden>
            <a class="tarjeta-perfil" href="perfil.html">
                <span id="mi-avatar" class="avatar-inicio"></span>
                <span class="texto"><strong id="mi-nombre">Tu perfil</strong><span>Foto y nombre de usuario</span></span>
                <span class="flecha">›</span>
            </a>
            <a class="tarjeta-multijugador" href="amigos.html">
                <span class="emoji">👥</span>
                <span class="texto"><strong>Amigos y partidas</strong><span id="detalle-amigos">Agregá amigos y desafialos</span></span>
                <span id="pendientes-amigos" class="insignia" hidden></span>
            </a>
            <h2 class="titulo-seccion">Juegos online</h2>
        </section>

        <section id="seccion-casino" class="seccion" hidden>
            <div class="billetera">
                <span class="moneda-grande"></span>
                <div><strong id="fichas-casino">1000</strong><span>fichas para todos los juegos del casino</span></div>
            </div>
        </section>

        <a id="seguir" class="seguir" href="#" hidden>
            <canvas></canvas>
            <span class="texto"><small>Seguir jugando</small><strong></strong></span>
            <span class="jugar-ya">▶</span>
        </a>

        <ul id="lista-juegos" class="lista-juegos"></ul>
    </main>

    <script src="js/juegos.js"></script>
    <script src="js/portadas.js"></script>
    <script src="js/app.js"></script>
    <script type="module">
        import { exigirSesion, cerrarSesion } from "./js/sesion.js";
        import { fichas } from "./js/fichas.js";

        const usuario = await exigirSesion();
        const nombre = usuario.displayName || usuario.email;
        document.getElementById("saludo").textContent = `Hola, ${nombre}`;
        document.getElementById("salir").addEventListener("click", cerrarSesion);
        document.getElementById("fichas-casino").textContent = fichas().toLocaleString("es-AR");

        // Perfil y cuántas cosas esperan respuesta: solicitudes de amistad, desafíos y turnos
        if (usuario.uid) {
            const m = await import("./js/multijugador.js");
            m.iniciarPresencia();
            const perfil = await m.miPerfil().catch(() => null);
            document.getElementById("mi-avatar").innerHTML = m.htmlAvatar(perfil, nombre);
            document.getElementById("mi-nombre").textContent = perfil?.nombre ?? "Elegí tu nombre de usuario";
            let solicitudes = 0;
            let turnos = 0;
            const pintar = () => {
                const total = solicitudes + turnos;
                for (const id of ["pendientes", "pendientes-amigos"]) {
                    const insignia = document.getElementById(id);
                    insignia.hidden = total === 0;
                    insignia.textContent = total;
                }
                document.getElementById("detalle-amigos").textContent =
                    total ? `${turnos} turno(s) y ${solicitudes} solicitud(es) esperando` : "Agregá amigos y desafialos";
            };
            m.escucharAmistades((lista) => {
                solicitudes = lista.filter((a) => a.estado === "pendiente" && a.para === usuario.uid).length;
                pintar();
            });
            m.escucharPartidas((lista) => {
                turnos = lista.filter((p) => p.estado !== "terminada" && p.turno === usuario.uid).length;
                pintar();
            });
        }
    </script>
</body>
</html>
