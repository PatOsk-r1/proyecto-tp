<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Proyecto TP</title>
    <meta name="description" content="Colección de juegos de Proyecto TP">
    <meta name="theme-color" content="#1b1440">

    <!-- Instalación en iPhone (Compartir → Agregar a inicio) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Proyecto TP">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="encabezado">
        <div>
            <h1>Proyecto TP</h1>
            <p id="saludo">Elegí un juego</p>
        </div>
        <button id="salir" class="boton-texto" type="button">Salir</button>
    </header>

    <a class="tarjeta-multijugador" href="amigos.html">
        <span class="emoji">👥</span>
        <span class="texto"><strong>Multijugador</strong><span>Agregá amigos y desafialos</span></span>
        <span id="pendientes" class="insignia" hidden></span>
    </a>

    <main>
        <ul id="lista-juegos" class="lista-juegos"></ul>
    </main>

    <script src="js/juegos.js"></script>
    <script src="js/app.js"></script>
    <script type="module">
        import { exigirSesion, cerrarSesion } from "./js/sesion.js";

        const usuario = await exigirSesion();
        const nombre = usuario.displayName || usuario.email;
        document.getElementById("saludo").textContent = `Hola, ${nombre}. Elegí un juego`;
        document.getElementById("salir").addEventListener("click", cerrarSesion);

        // Cuántas cosas esperan respuesta: solicitudes de amistad, desafíos y turnos
        if (usuario.uid) {
            const { escucharAmistades, escucharPartidas } = await import("./js/multijugador.js");
            let solicitudes = 0;
            let turnos = 0;
            const pintar = () => {
                const total = solicitudes + turnos;
                const insignia = document.getElementById("pendientes");
                insignia.hidden = total === 0;
                insignia.textContent = total;
            };
            escucharAmistades((lista) => {
                solicitudes = lista.filter((a) => a.estado === "pendiente" && a.para === usuario.uid).length;
                pintar();
            });
            escucharPartidas((lista) => {
                turnos = lista.filter((p) => p.estado !== "terminada" && p.turno === usuario.uid).length;
                pintar();
            });
        }
    </script>
</body>
</html>
