<!DOCTYPE html>
<html lang="es" class="verificando">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Proyecto TP</title>
    <meta name="description" content="Colección de juegos de Proyecto TP">
    <meta name="theme-color" content="#1b1440">

    <!-- Instalación en iPhone (Compartir → Agregar a inicio) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Proyecto TP">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="encabezado">
        <div>
            <h1>Proyecto TP</h1>
            <p id="saludo">Elegí un juego</p>
        </div>
        <button id="salir" class="boton-texto" type="button">Salir</button>
    </header>

    <main>
        <ul id="lista-juegos" class="lista-juegos"></ul>
    </main>

    <script src="js/juegos.js"></script>
    <script src="js/app.js"></script>
    <script type="module">
        import { exigirSesion, cerrarSesion } from "./js/sesion.js";

        const usuario = await exigirSesion();
        const nombre = usuario.displayName || usuario.email;
        document.getElementById("saludo").textContent = `Hola, ${nombre}. Elegí un juego`;
        document.getElementById("salir").addEventListener("click", cerrarSesion);
    </script>
</body>
</html>
